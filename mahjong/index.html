<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>广东麻将</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a0a1a;display:flex;justify-content:center;align-items:center;min-height:100dvh;font-family:sans-serif;overflow:hidden}
.wrap{background:linear-gradient(145deg,#2d1a2d,#1a0a1a);padding:12px;border-radius:16px;box-shadow:0 0 40px rgba(0,0,0,.4)}
canvas{display:block;border-radius:10px;touch-action:none;max-width:100vw;max-height:98dvh}
.bar{display:flex;justify-content:space-between;align-items:center;padding:4px 8px 0;color:rgba(255,255,255,.5);font-size:13px}
.bar a{color:rgba(255,255,255,.35);text-decoration:none}
.bar a:hover{color:#e94560}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <a href="../">← 返回</a>
    <span>🀄 广东麻将</span>
    <span id="info">剩余 0 张</span>
  </div>
  <canvas id="c" width="800" height="560"></canvas>
</div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
const W=800,H=560,TW=42,TH=56;
const SUITS={wan:0,tiao:1,tong:2};
const SUIT_NAME={wan:'万',tiao:'索',tong:'筒'};
const SUIT_COLOR={wan:'#27ae60',tiao:'#2980b9',tong:'#e74c3c'};
const WIND=['東','南','西','北'],DRAGON=['中','發','白'];
function tileLabel(t){
  if(t.type==='wan')return (t.val+1)+'萬';
  if(t.type==='tiao')return (t.val+1)+'索';
  if(t.type==='tong')return (t.val+1)+'筒';
  if(t.type==='wind')return WIND[t.val];
  return DRAGON[t.val];
}
function tileShort(t){
  if(t.type==='wan')return (t.val+1)+'万';
  if(t.type==='tiao')return (t.val+1)+'索';
  if(t.type==='tong')return (t.val+1)+'筒';
  if(t.type==='wind')return WIND[t.val];
  return DRAGON[t.val];
}

// --- Deck ---
function mkDeck(){
  const d=[];let id=0;
  for(let s=0;s<3;s++)for(let v=0;v<9;v++)for(let i=0;i<4;i++)d.push({type:Object.keys(SUITS)[s],val:v,id:id++});
  for(let v=0;v<4;v++)for(let i=0;i<4;i++)d.push({type:'wind',val:v,id:id++});
  for(let v=0;v<3;v++)for(let i=0;i<4;i++)d.push({type:'dragon',val:v,id:id++});
  return d;
}
function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function sortH(a){const o={wan:0,tiao:1,tong:2,wind:3,dragon:4};return a.sort((a,b)=>o[a.type]-o[b.type]||a.val-b.val);}
function tileKey(t){return t.type+'_'+t.val;}
function countRanks(hand){const g={};hand.forEach(t=>{const k=tileKey(t);g[k]=(g[k]||0)+1;});return g;}

// --- Win detection ---
function canFormMelds(g,keys,idx){
  // g is a mutable groups object; keys are sorted group keys
  // Try to form all remaining tiles into melds (triplets or sequences)
  if(idx>=keys.length){
    for(const k in g) if(g[k]!==0) return false;
    return true;
  }
  const k=keys[idx];
  if(g[k]===0) return canFormMelds(g,keys,idx+1);
  const [type,val]=k.split('_');const v=parseInt(val);

  // try triplet
  if(g[k]>=3){
    g[k]-=3;
    if(canFormMelds(g,keys,idx))return true;
    g[k]+=3;
  }
  // try sequence (wan/tiao/tong only, val 0-8)
  if(type in SUITS&&v<=6){
    const k2=type+'_'+(v+1),k3=type+'_'+(v+2);
    if((g[k2]||0)>=1&&(g[k3]||0)>=1){
      g[k]--;g[k2]--;g[k3]--;
      if(canFormMelds(g,keys,idx))return true;
      g[k]++;g[k2]++;g[k3]++;
    }
  }
  return false;
}
function isWin(hand){
  if(hand.length%3!==2)return false;
  const g=countRanks(hand);
  const keys=Object.keys(g).sort();
  // try each possible pair
  for(const k of keys){
    if(g[k]>=2){
      g[k]-=2;
      if(canFormMelds(g,keys,0)){g[k]+=2;return true;}
      g[k]+=2;
    }
  }
  return false;
}
function canWinWith(hand,newTile){
  const t=[...hand,newTile];sortH(t);return isWin(t);
}
function getTenpai(hand){
  // hand has 13 tiles; find tiles that would make it a winning hand
  const results=[];
  const allTypes=[];
  for(let s of ['wan','tiao','tong']){for(let v=0;v<9;v++)allTypes.push({type:s,val:v});}
  for(let v=0;v<4;v++)allTypes.push({type:'wind',val:v});
  for(let v=0;v<3;v++)allTypes.push({type:'dragon',val:v});
  for(const t of allTypes){
    const test=[...hand,{...t,id:-1}];
    sortH(test);
    if(isWin(test))results.push(t);
  }
  return results;
}

// --- Shanten (向听数) ---
function calcShanten(hand){
  // 14 tiles → return 0 (win), 1 (tenpai/一向听), 2, etc.
  if(isWin(hand))return 0;
  const g=countRanks(hand);
  const keys=Object.keys(g).sort();
  let bestShanten=8;
  // Try removing each tile (simulate each possible discard)
  if(hand.length===14){
    for(let i=0;i<hand.length;i++){
      const h14=[...hand];h14.splice(i,1);
      const g13=countRanks(h14);
      const keys13=Object.keys(g13).sort();
      // Try adding each possible tile
      let minS=8;
      for(const k of keys13){
        if(g13[k]>=2){
          g13[k]-=2;
          const melds=countMelds(g13,keys13);
          const shanten=4-melds;
          if(shanten<minS)minS=shanten;
          g13[k]+=2;
        }
      }
      if(minS<bestShanten)bestShanten=minS;
    }
  }
  return Math.max(0,bestShanten);
}
function countMelds(g,keys){
  let melds=0;
  const gc={};for(const k of keys)gc[k]=g[k];
  const ks=[...keys];
  let i=0;
  while(i<ks.length){
    const k=ks[i];
    if(!gc[k]||gc[k]<=0){i++;continue;}
    const [type,val]=k.split('_');const v=parseInt(val);
    // try triplet
    if(gc[k]>=3){gc[k]-=3;melds++;continue;}
    // try sequence
    if(type in SUITS&&v<=6){
      const k2=type+'_'+(v+1),k3=type+'_'+(v+2);
      if((gc[k2]||0)>=1&&(gc[k3]||0)>=1){
        gc[k]--;gc[k2]--;gc[k3]--;melds++;continue;
      }
    }
    i++;
  }
  return melds;
}

// --- AI ---
function aiDecide(hand,drawTile,gs){
  // Choose best discard from 14 tiles
  const h14=[...hand,drawTile];sortH(h14);
  let bestIdx=0,bestSh=99,bestSafe=true;
  // Check each discard
  for(let i=0;i<h14.length;i++){
    const h13=h14.filter((_,j)=>j!==i);
    const disc=h14[i];
    // heuristic: prefer safe tiles
    const isSafe=gs.discards.some(d=>tileKey(d)===tileKey(disc));
    const sh=calcShantenFrom13(h13);
    const score=sh*10+(isSafe?0:2);
    if(score<bestSh||(score===bestSh&&isSafe&&!bestSafe)){
      bestSh=score;bestIdx=i;bestSafe=isSafe;
    }
  }
  return h14[bestIdx];
}
function calcShantenFrom13(h13){
  // 13 tiles → try pair + count melds
  const g=countRanks(h13);
  const keys=Object.keys(g).sort();
  let maxMelds=0;
  for(const k of keys){
    if(g[k]>=2){
      const gc={};for(const k2 of keys)gc[k2]=g[k2];
      gc[k]-=2;
      maxMelds=Math.max(maxMelds,countMeldsQuick(gc,keys));
    }
  }
  return Math.max(0,4-maxMelds);
}
function countMeldsQuick(gc,keys){
  // greedy meld count (for shanten estimation)
  let melds=0;
  const ks=[...keys];
  let i=0;
  while(i<ks.length){
    const k=ks[i];
    if(!gc[k]||gc[k]<=0){i++;continue;}
    const [type,val]=k.split('_');const v=parseInt(val);
    if(gc[k]>=3){gc[k]-=3;melds++;continue;}
    if(type in SUITS&&v<=6){
      const k2=type+'_'+(v+1),k3=type+'_'+(v+2);
      if((gc[k2]||0)>=1&&(gc[k3]||0)>=1){gc[k]--;gc[k2]--;gc[k3]--;melds++;continue;}
    }
    i++;
  }
  // also count taatsu (partial melds)
  let taatsu=0;
  const g2={};for(const k of ks)g2[k]=gc[k];
  for(const k of ks){
    if(!g2[k]||g2[k]<=0)continue;
    const [type,val]=k.split('_');const v=parseInt(val);
    if(g2[k]>=2){g2[k]-=2;taatsu++;continue;} // pair as taatsu
    if(type in SUITS&&v<=7){
      const k2=type+'_'+(v+1);
      if((g2[k2]||0)>=1){g2[k]--;g2[k2]--;taatsu++;continue;} // ryankan
    }
    if(type in SUITS&&v<=6){
      const k2=type+'_'+(v+2);
      if((g2[k2]||0)>=1){g2[k]--;g2[k2]--;taatsu++;continue;} // kanchan
    }
  }
  const remaining=Object.values(g2).reduce((a,b)=>a+b,0);
  return melds+Math.min(taatsu,4-melds)+Math.floor(remaining/3);
}

// --- Game State ---
let gs;
function initGame(){
  const wall=shuf(mkDeck());
  const hands=[];
  for(let p=0;p<4;p++){
    const n=p===0?14:13;
    hands[p]=sortH(wall.splice(0,n));
  }
  gs={
    wall,hands,
    discards:[[],[],[],[]],
    melds:[[],[],[],[]],       // exposed melds per player
    turn:0,                    // 0=human, 1,2,3=AI
    msg:'你的回合：点击手牌弃掉一张',
    gameOver:false,
    winner:-1,
    scores:[0,0,0,0],
    drawnTile:null,            // tile just drawn (shown beside hand)
    pendingPong:-1,            // if someone can pong, store player and tile
    pendingChi:-1,
    canWin:false,
    phase:'draw'               // draw→action→discard→next
  };
  gs.drawnTile=gs.hands[0].pop(); // first turn already has drawn tile
  document.getElementById('info').textContent='剩余 '+gs.wall.length+' 张';
  render();
  // Auto play for AI that starts first (but player 0 always starts as dealer)
}

// --- Core Turn Flow ---
function nextTurn(){
  if(gs.gameOver)return;
  gs.turn=(gs.turn+1)%4;
  gs.drawnTile=null;gs.canWin=false;gs.pendingPong=-1;gs.pendingChi=-1;gs.phase='draw';
  if(gs.wall.length===0){
    gs.msg='流局！牌墙已空';gs.gameOver=true;render();return;
  }
  const tile=gs.wall.pop();
  gs.hands[gs.turn].push(tile);
  sortH(gs.hands[gs.turn]);

  if(gs.turn===0){
    gs.drawnTile=tile;
    gs.canWin=isWin(gs.hands[0]);
    document.getElementById('info').textContent='剩余 '+gs.wall.length+' 张';
    gs.msg='你的回合：点击手牌弃掉一张'+(gs.canWin?' (可胡牌！点击摸到的牌)':'');
    render();
  }else{
    document.getElementById('info').textContent='剩余 '+gs.wall.length+' 张';
    gs.msg='AI 思考中...';render();
    setTimeout(doAITurn,300);
  }
}
function doAITurn(){
  if(gs.gameOver)return;
  const hand=gs.hands[gs.turn];
  // check win immediately
  if(isWin(hand)){
    gs.winner=gs.turn;gs.gameOver=true;
    gs.msg=`AI-${gs.turn} 自摸胡了！`;render();return;
  }
  // discard a tile using AI strategy
  const disc=aiDecide(hand.slice(0,-1),hand[hand.length-1],gs);
  const idx=gs.hands[gs.turn].findIndex(t=>t.type===disc.type&&t.val===disc.val&&t.id===disc.id);
  if(idx!==-1)gs.hands[gs.turn].splice(idx,1);
  gs.discards[gs.turn].push(disc);
  gs.msg=`AI-${gs.turn} 弃掉了 ${tileShort(disc)}`;
  document.getElementById('info').textContent='剩余 '+gs.wall.length+' 张';
  render();
  setTimeout(nextTurn,500);
}
function humanDiscard(idx){
  if(gs.gameOver||gs.turn!==0||gs.phase==='end')return;
  const hand=gs.hands[0];
  const tile=hand[idx];
  // check if this was the drawn tile (can't discard drawn tile unless win)
  // Actually player can discard any tile.
  hand.splice(idx,1);
  sortH(hand);
  gs.discards[0].push(tile);
  gs.drawnTile=null;gs.canWin=false;
  gs.msg=`你弃掉了 ${tileShort(tile)}`;
  document.getElementById('info').textContent='剩余 '+gs.wall.length+' 张';
  render();
  setTimeout(nextTurn,500);
}
function humanWin(){
  if(!gs.canWin||gs.turn!==0||gs.gameOver)return;
  gs.winner=0;gs.gameOver=true;
  gs.msg='你胡了！🎉';render();
}

// --- Render ---
let selectedIdx=-1;
function render(){
  X.clearRect(0,0,W,H);
  const grd=X.createRadialGradient(400,280,30,400,280,360);
  grd.addColorStop(0,'#3d1a3d');grd.addColorStop(1,'#1a0a1a');
  X.fillStyle=grd;X.fillRect(0,0,W,H);

  // Draw each player's tiles
  const pos=[{x:0,y:0},{x:0,y:0},{x:0,y:0},{x:0,y:0}];
  // Player 0 (bottom, human)
  drawHand(gs.hands[0],80,470,40,true,0,gs.drawnTile);

  // Player 1 (right, AI) — show backs
  drawBacks(gs.hands[1].length,720,120,20,false,1);
  drawMelds(gs.melds[1],650,120,1);

  // Player 2 (top, AI) — show backs
  drawBacks(gs.hands[2].length,340,12,16,true,2);
  drawMelds(gs.melds[2],200,50,2);

  // Player 3 (left, AI) — show backs
  drawBacks(gs.hands[3].length,12,120,20,false,3);
  drawMelds(gs.melds[3],50,120,3);

  // discard areas
  for(let p=0;p<4;p++){
    if(gs.discards[p].length===0)continue;
    const arr=gs.discards[p].slice(-6);
    const baseX=[340,620,340,80][p],baseY=[360,210,50,210][p];
    arr.forEach((t,i)=>{
      const ox=p%2===0?i*30:0,oy=p%2===0?0:i*30;
      drawTile(baseX+ox,baseY+oy,t);
    });
  }

  // labels
  X.fillStyle='rgba(255,255,255,.4)';X.font='12px sans-serif';X.textAlign='center';
  const labels=['你','AI-1','AI-2','AI-3'];
  const lpos=[[400,560],[770,260],[400,8],[30,260]];
  for(let p=0;p<4;p++)X.fillText(labels[p]+(gs.turn===p?' ←':'')+(gs.melds[p].length>0?' M':''),lpos[p][0],lpos[p][1]-4);

  // msg bar
  if(gs.msg){
    X.fillStyle='rgba(0,0,0,.6)';roundR(220,170,360,34,8);X.fill();
    X.fillStyle='#fff';X.font='14px sans-serif';X.textAlign='center';
    X.fillText(gs.msg,400,194);
  }
  if(gs.gameOver){
    X.fillStyle='rgba(0,0,0,.7)';X.fillRect(0,0,W,H);
    X.fillStyle='#f0c040';X.font='bold 36px sans-serif';X.textAlign='center';
    X.fillText(gs.msg,400,270);
    X.fillStyle='#fff';X.font='16px sans-serif';
    X.fillText('点击画面重新开始',400,320);
  }

  // Win button indicator if can win
  if(gs.canWin&&gs.turn===0&&!gs.gameOver){
    X.fillStyle='rgba(0,0,0,.5)';roundR(620,440,140,40,8);X.fill();
    X.fillStyle='#f0c040';X.font='bold 18px sans-serif';X.textAlign='center';
    X.fillText('点击胡牌 →',690,466);
  }
}

function drawHand(hand,x,y,spacing,faceUp,player,drawnTile){
  const len=hand.length;
  for(let i=0;i<len;i++){
    const sx=x+i*spacing,sel=(player===0&&i===selectedIdx);
    drawTile(sx,sel?y-12:y,hand[i],sel);
  }
  // draw drawn tile to the right
  if(player===0&&drawnTile){
    drawTile(x+len*spacing+8,y+8,drawnTile,false,true);
  }
}
function drawBacks(count,x,y,spacing,horizontal,player){
  for(let i=0;i<count;i++){
    const sx=horizontal?x+i*spacing:x, sy=horizontal?y:y+i*spacing;
    X.fillStyle='#2a1a5a';X.shadowBlur=4;X.shadowColor='rgba(0,0,0,.2)';
    roundR(sx,sy,TW-4,TH-4,3);X.fill();X.shadowBlur=0;
    X.fillStyle='rgba(255,255,255,.08)';X.font='11px serif';X.textAlign='center';
    if(horizontal){X.fillText('🀄',sx+15,sy+28);}else{X.fillText('🀄',sx+14,sy+30);}
  }
}
function drawMelds(melds,x,y,player){
  melds.forEach((m,i)=>{
    const mTileColors={chi:'#e8e0d0',pong:'#e8e0d0',kong:'#faf5e8'};
    const ox=player%2===0?x+i*140:x,oy=player%2===0?y:y+i*80;
    m.forEach((t,j)=>{
      const px=player%2===0?ox+j*32:ox,py=player%2===0?oy:oy+j*32;
      drawTile(px,py,t);
    });
  });
}
function drawTile(x,y,t,selected,isDraw){
  X.shadowBlur=selected?14:3;
  X.shadowColor=selected?'rgba(93,173,226,.7)':'rgba(0,0,0,.2)';
  X.fillStyle=isDraw?'#fffde8':'#faf5e8';
  roundR(x,y,TW-2,TH-2,4);X.fill();X.shadowBlur=0;
  if(selected){X.strokeStyle='#5dade2';X.lineWidth=2;roundR(x,y,TW-2,TH-2,4);X.stroke();}
  if(isDraw){X.strokeStyle='#f0c040';X.lineWidth=1.5;roundR(x+1,y+1,TW-4,TH-4,4);X.stroke();}
  if(t.type==='wind'||t.type==='dragon'){
    let lbl=t.type==='wind'?WIND[t.val]:DRAGON[t.val];
    const col=t.type==='dragon'&&t.val===1?'#27ae60':t.type==='dragon'&&t.val===2?'#faf5e8':'#e74c3c';
    if(t.type==='dragon'&&t.val===0)lbl='🀄';
    X.fillStyle=col;X.font='bold 15px serif';X.textAlign='center';
    X.fillText(lbl,x+TW/2-1,y+33);
  }else{
    const col=SUIT_COLOR[t.type];
    const num=t.val+1;
    X.fillStyle=col;X.font='bold 12px serif';X.textAlign='center';
    X.fillText(num,x+TW/2-1,y+22);
    X.font='10px serif';
    X.fillText(t.type==='wan'?'万':t.type==='tiao'?'索':'筒',x+TW/2-1,y+40);
  }
}
function roundR(x,y,w,h,r){
  X.beginPath();X.moveTo(x+r,y);X.lineTo(x+w-r,y);X.quadraticCurveTo(x+w,y,x+w,y+r);
  X.lineTo(x+w,y+h-r);X.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  X.lineTo(x+r,y+h);X.quadraticCurveTo(x,y+h,x,y+h-r);
  X.lineTo(x,y+r);X.quadraticCurveTo(x,y,x+r,y);X.closePath();
}

// --- Input ---
C.addEventListener('click',e=>{
  if(gs.gameOver){initGame();return;}
  if(gs.turn!==0)return;
  const r=C.getBoundingClientRect();
  const sx=C.width/r.width,sy=C.height/r.height;
  const mx=(e.clientX-r.left)*sx,my=(e.clientY-r.top)*sy;

  // check drawn tile (win)
  if(gs.drawnTile&&gs.canWin){
    const dx=80+gs.hands[0].length*40+8,dy=478;
    if(mx>=dx&&mx<=dx+TW&&my>=dy&&my<=dy+TH){
      humanWin();return;
    }
  }

  // check hand tiles (select for discard)
  const hx=80;
  for(let i=0;i<gs.hands[0].length;i++){
    const tx=hx+i*40,ty=470;
    if(mx>=tx&&mx<=tx+TW&&my>=ty&&my<=ty+TH){
      if(gs.drawnTile){
        selectedIdx=selectedIdx===i?-1:i;
        if(selectedIdx!==-1)humanDiscard(selectedIdx);
        else render();
      }else{
        humanDiscard(i);
      }
      return;
    }
  }
});
C.addEventListener('touchstart',e=>e.preventDefault());

initGame();
</script>
</body>
</html>
