<style>
:root{

  --danger:#c0392b; --shadow:0 1px 3px rgba(0,0,0,.07); --shadow2:0 6px 24px rgba(0,0,0,.10);
  --radius:14px; --ok:#3f7f6b;
}
body.dark{
  --bg:#141210; --panel:#1f1c19; --panel2:#26221e; --text:#ece7db; --muted:#9a948a;
  --accent:#d8604f; --accent2:#5aa08a; --gold:#c9a24a; --border:#35312b;
  --danger:#e06c5b; --shadow:0 1px 3px rgba(0,0,0,.4); --shadow2:0 6px 24px rgba(0,0,0,.5);

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.55}
a{color:var(--accent2);text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent2);outline-offset:-1px}
textarea{resize:vertical;min-height:52px}

#app{max-width:1200px;margin:0 auto;display:flex;min-height:100vh}
#sidebar{width:216px;flex:0 0 216px;background:var(--panel);border-right:1px solid var(--border);padding:20px 12px;position:sticky;top:0;height:100vh;overflow:auto}
#sidebar .logo{font-size:19px;font-weight:700;letter-spacing:.5px;padding:2px 10px 16px;color:var(--accent)}
#sidebar .logo small{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:2px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--text);margin-bottom:3px;cursor:pointer;border:none;background:none;width:100%;text-align:left;font-size:14px}
.nav-item:hover{background:var(--panel2)}
.nav-item.active{background:var(--accent);color:#fff}
.nav-item .ico{font-size:17px;width:22px;text-align:center}
#main{flex:1;min-width:0;padding:22px 24px 90px}
#tabbar{display:none}

.page-title{font-size:22px;font-weight:700;margin:4px 0 14px}
.subtitle{color:var(--muted);font-size:13px;margin:-8px 0 16px}

/* cards & grid */
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:16px}
.grid{display:grid;gap:14px}
.dish-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.dish-card{position:relative;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;cursor:pointer;transition:transform .08s}
.dish-card:hover{transform:translateY(-2px)}
.dish-cover{height:96px;display:flex;align-items:center;justify-content:center;font-size:42px;position:relative}
.dish-cover .cuisine-bar{position:absolute;left:0;top:0;bottom:0;width:4px}
.dish-body{padding:10px 12px 12px}
.dish-name{font-weight:600;font-size:15px;line-height:1.3;margin-bottom:5px}
.dish-meta{display:flex;flex-wrap:wrap;gap:5px;font-size:11px;color:var(--muted);align-items:center}
.tag{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11px;background:var(--panel2);border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.tag.hot{color:var(--accent);border-color:var(--accent)}
.spicy{color:var(--accent);font-size:12px;letter-spacing:-1px}
.dish-add{position:absolute;right:8px;bottom:8px;width:30px;height:30px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow2)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:10px;padding:9px 15px;font-size:14px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:#a33828}
.btn-green{background:var(--accent2);border-color:var(--accent2);color:#fff}
.btn-ghost{background:none;border-color:transparent;color:var(--muted)}
.btn-danger{background:none;border-color:var(--danger);color:var(--danger)}
.btn-sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn-lg{padding:13px 22px;font-size:16px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn-row.sticky{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 40%);padding:14px 0 6px;z-index:5}

/* tabs / chips */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{padding:6px 13px;border-radius:20px;border:1px solid var(--border);background:var(--panel);cursor:pointer;font-size:13px;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tabbar-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;-webkit-overflow-scrolling:touch}
.tabbar-scroll::-webkit-scrollbar{display:none}

/* forms */
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
input.w-full,select.w-full,textarea.w-full{width:100%}
.inline-inputs{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* lists */
.row-item{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border)}
.row-item:last-child{border-bottom:none}
.row-item .grow{flex:1;min-width:0}
.row-item .name{font-weight:500}
.row-item .sub{font-size:12px;color:var(--muted)}
.row-item .sub .link{color:var(--accent2);cursor:pointer}
.strike{text-decoration:line-through;color:var(--muted)}

/* sections in shopping */
.sec-head{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:10px 14px;background:var(--panel2);border-bottom:1px solid var(--border);color:var(--accent)}
.sec-head .n{background:var(--accent);color:#fff;font-size:11px;border-radius:10px;padding:0 8px}
.check{width:20px;height:20px;border-radius:6px;border:2px solid var(--border);flex:0 0 20px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:13px;background:var(--panel)}
.check.on{background:var(--accent2);border-color:var(--accent2)}

/* cook */
.cook-step{display:flex;gap:14px;padding:18px 16px;border-bottom:1px solid var(--border);align-items:flex-start}
.cook-no{flex:0 0 34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.cook-step.done .cook-no{background:var(--accent2)}
.cook-step .txt{font-size:20px;line-height:1.5;font-weight:500}
.cook-step .dish-tag{font-size:12px;color:var(--accent2);font-weight:600;margin-bottom:2px}
.cook-step .hint{font-size:13px;color:var(--gold);margin-top:6px}
.cook-step .min{font-size:13px;color:var(--muted);margin-top:4px}
.timer-box{margin-top:10px}
.timer-display{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent)}
.timer-bar{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden;margin-top:6px}
.timer-bar i{display:block;height:100%;background:var(--accent);transition:width 1s linear}

/* modal & toast */
#modal{position:fixed;inset:0;z-index:100;display:none}
#modal.show{display:block}
.modal-mask{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.modal-box{position:relative;max-width:440px;margin:12vh auto 0;background:var(--panel);border-radius:16px;padding:20px;box-shadow:var(--shadow2)}
.modal-box h3{margin:0 0 10px;font-size:17px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.modal-box .alert{color:var(--danger);font-weight:600;margin:8px 0}
#toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:24px;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:200;max-width:88%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--danger);color:#fff}

.empty{text-align:center;padding:46px 20px;color:var(--muted)}
.empty .big{font-size:46px;margin-bottom:8px}
.warn-banner{background:rgba(192,57,43,.1);border:1px solid var(--danger);color:var(--danger);border-radius:10px;padding:10px 14px;font-size:13px;margin:10px 0}
.info-banner{background:rgba(63,127,107,.12);border:1px solid var(--accent2);color:var(--accent2);border-radius:10px;padding:10px 14px;font-size:13px;margin:10px 0}

.stepper{display:inline-flex;align-items:center;gap:0;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.stepper button{width:30px;height:30px;border:none;background:var(--panel2);font-size:16px;color:var(--text)}
.stepper .v{min-width:28px;text-align:center;font-weight:600}

@media (max-width:899px){
  #sidebar{display:none}
  #main{padding:16px 14px 86px}
  #tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--border);z-index:50;padding-bottom:env(safe-area-inset-bottom)}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:11px;color:var(--muted);cursor:pointer;border:none;background:none}
  .tab .ico{font-size:20px}
  .tab.on{color:var(--accent);font-weight:600}
  .form-grid{grid-template-columns:1fr}
  .field-row,.field-3{grid-template-columns:1fr 1fr}
  .dish-grid{grid-template-columns:repeat(auto-fill,minmax(126px,1fr))}
}
@media (max-width:480px){
  .dish-grid{grid-template-columns:repeat(2,1fr)}
  .cook-step .txt{font-size:18px}
}
@media print{
  body{background:#fff}
  #sidebar,#tabbar,#modal,#toast,.no-print,.btn-row,.dish-add{display:none !important}
  #app{max-width:100%}
  #main{padding:0}
  .card{border:none;box-shadow:none}
  .print-only{display:block !important}
  a{color:#000}
}
.print-only{display:none}
</style>

/* ============================================================
 * KM.core —— 纯逻辑层（不依赖 document / window）
 * ============================================================ */
const KM = {};
KM.core = (function(){
  const STORE_KEY = 'kitchen_menu_v1';
  const UNITS = ['g','kg','斤','两','ml','L','汤匙','茶匙','个','只','条','瓣','根','片','颗','把','适量','少许'];
  const FUZZY_UNITS = ['适量','少许'];
  const SECTIONS = ['meat','veg','staple','dry','seasoning','fuzzy'];
  const SECTION_LABEL = { meat:'肉蛋', veg:'蔬果', staple:'主食豆制品', dry:'干货', seasoning:'调味', fuzzy:'酌量' };
  const SECTION_ORDER = { meat:0, veg:1, staple:2, dry:3, seasoning:4, fuzzy:5 };
  const ALLERGENS = ['花生','坚果','甲壳类','鱼类','蛋','乳制品','麸质','大豆'];
  const ORDER_STATUS = ['draft','confirmed','prepped','cooking','done'];
  const STATUS_LABEL = { draft:'选菜中', confirmed:'已确认', prepped:'备菜中', cooking:'烹饪中', done:'已完成' };

  function isFuzzy(u){ return FUZZY_UNITS.indexOf(u) >= 0; }

  function toBase(amount, unit){
    amount = Number(amount) || 0;
    if(!unit) return [amount, ''];
    if(unit === 'kg') return [amount*1000, 'g'];
    if(unit === '斤') return [amount*500, 'g'];
    if(unit === '两') return [amount*50, 'g'];
    if(unit === 'L') return [amount*1000, 'ml'];
    if(unit === '汤匙') return [amount*15, 'ml'];
    if(unit === '茶匙') return [amount*5, 'ml'];
    return [amount, unit]; // g / ml / 个/只/条/瓣/根/片/颗/把 各自独立
  }

  function round1(n){ return Math.round(n*10)/10; }
  function fmtNum(n){
    n = round1(Number(n)||0);
    return Number.isInteger(n) ? String(n) : String(n);
  }
  function beautify(amount, unit){
    if(unit === 'g' && amount >= 1000) return [round1(amount/1000), 'kg'];
    if(unit === 'ml' && amount >= 1000) return [round1(amount/1000), 'L'];
    return [round1(amount), unit];
  }

  function normalizeName(name, aliasMap){
    name = String(name||'').replace(/\s+/g, '');
    if(!name) return name;
    if(aliasMap){
      for(let i=0;i<aliasMap.length;i++){
        const a = aliasMap[i];
        if(a && a.alias && a.alias.indexOf(name) >= 0) return a.standard;
      }
    }
    return name;
  }

  function buildAliasMap(data){
    // 别名归一只信全局 aliasMap（PRD §7.1 的别名表）。
    // 不扫食材自带的 alias 字段：seed 里「番茄(别名西红柿)」与「西红柿(别名番茄)」会
    // 造成双向映射，反而把同名食材拆成两行。
    const map = []; const seen = {};
    (data.aliasMap||[]).forEach(function(x){
      if(!x || !x.standard || !x.alias) return;
      x.alias.forEach(function(a){
        if(a && a !== x.standard && !seen[a]){ map.push({standard:x.standard, alias:a}); seen[a]=true; }
      });
    });
    return map;
  }

  function shouldScale(ing, settings){
    if(!ing || !ing.scale) return false;
    if(ing.section === 'seasoning' && settings && settings.scaleSeasoning === false) return false;
    return true;
  }

  function effServings(it, order){
    const v = it.servingsOverride;
    if(v === null || v === undefined || v === '' || Number(v) <= 0) return (order && order.servings) || 1;
    return Number(v);
  }

  /* 7.1 食材合并 */
  function mergeIngredients(data, order){
    const byId = {};
    (data.dishes||[]).forEach(d => byId[d.id] = d);
    const aliasMap = buildAliasMap(data);
    const settings = data.settings || {};
    const pantry = data.pantry || [];
    const servings = (order && order.servings) || 2;
    const acc = new Map();
    const fuzzy = new Map();

    (order.items||[]).forEach(function(it){
      const dish = byId[it.dishId];
      if(!dish) return;
      const factor = effServings(it, order) / (dish.baseServings||2) * (it.qty||1);
      const srcLabel = dish.name + ((it.qty||1) > 1 ? ' ×'+it.qty : '');
      (dish.ingredients||[]).forEach(function(ing){
        const name = normalizeName(ing.name, aliasMap);
        if(isFuzzy(ing.unit)){
          const k = name + '@' + ing.unit;
          let e = fuzzy.get(k);
          if(!e){ e = { key:'fz_'+name, name:name, amount:0, unit:ing.unit, section:'fuzzy', sources:[], optional:!!ing.optional, fuzzy:true }; fuzzy.set(k,e); }
          if(e.sources.indexOf(srcLabel) < 0) e.sources.push(srcLabel);
          if(ing.optional) e.optional = true;
          return;
        }
        const base = toBase(ing.amount, ing.unit);
        const scaled = shouldScale(ing, settings) ? base[0] * factor : base[0];
        const key = name + '@' + base[1];
        let item = acc.get(key);
        if(!item){
          item = { key:key, name:name, amount:0, unit:base[1], section:ing.section||'veg', sources:[], optional:!!ing.optional, fuzzy:false };
          acc.set(key, item);
        }
        item.amount += scaled;
        if(item.sources.indexOf(srcLabel) < 0) item.sources.push(srcLabel);
        if(ing.optional) item.optional = true;
      });
    });

    const out = [];
    acc.forEach(function(it){
      const b = beautify(it.amount, it.unit);
      it.amount = b[0]; it.unit = b[1];
      it.hasAtHome = pantry.some(p => p.name === it.name);
      out.push(it);
    });
    fuzzy.forEach(function(it){ it.hasAtHome = pantry.some(p => p.name === it.name); out.push(it); });

    out.sort(function(a,b){
      const sa = SECTION_ORDER[a.section]!=null ? SECTION_ORDER[a.section] : 9;
      const sb = SECTION_ORDER[b.section]!=null ? SECTION_ORDER[b.section] : 9;
      if(sa !== sb) return sa - sb;
      return a.name.localeCompare(b.name, 'zh');
    });
    return out;
  }

  /* 7.3 并行备菜建议（贪心） */
  function planSteps(data, order){
    const byId = {};
    (data.dishes||[]).forEach(d => byId[d.id] = d);
    const lead = [], rest = [];
    (order.items||[]).forEach(function(it){
      const dish = byId[it.dishId];
      if(!dish) return;
      const steps = dish.steps||[];
      let i = 0;
      while(i < steps.length && steps[i].parallel) i++;
      for(let k=0;k<i;k++) lead.push({dishName:dish.name, dishId:dish.id, step:steps[k], qty:it.qty||1});
      for(let k=i;k<steps.length;k++) rest.push({dishName:dish.name, dishId:dish.id, step:steps[k], qty:it.qty||1});
    });
    const merged = lead.concat(rest);
    const seenTool = {};
    const steps = merged.map(function(f){
      let hint = '';
      if(f.step.parallel) hint = '⏳ 等待中，可同时做别的';
      if(f.step.tool){
        if(seenTool[f.step.tool]) hint = (hint ? hint+' · ' : '') + '⚠ 同用「'+f.step.tool+'」，建议错开';
        seenTool[f.step.tool] = true;
      }
      return { dishName:f.dishName, dishId:f.dishId, step:f.step, qty:f.qty, hint:hint };
    });
    let serial = 0, saving = 0;
    merged.forEach(function(f){ const m = f.step.min||0; serial += m; if(f.step.parallel) saving += m; });
    const total = Math.max(0, serial - saving);
    return { steps:steps, serial:serial, saving:saving, total:total };
  }

  function normalizeData(d){
    d = d || {};
    d.schemaVersion = d.schemaVersion || 1;
    d.settings = Object.assign({defaultServings:2, allergens:[], scaleSeasoning:false, theme:'light', lastOrderId:''}, d.settings||{});
    d.cuisines = d.cuisines||[];
    d.categories = d.categories||[];
    d.dishes = d.dishes||[];
    d.orders = d.orders||[];
    d.pantry = d.pantry||[];
    d.history = d.history||[];
    d.aliasMap = d.aliasMap||[];
    return d;
  }

  function _get(key){ try { return localStorage.getItem(key); } catch(e){ return null; } }
  function _set(key, val){ try { localStorage.setItem(key, val); return true; } catch(e){ return false; } }

  function storeLoad(){
    const raw = _get(STORE_KEY) || _get(STORE_KEY+'__bak') || _get(STORE_KEY+'__bak2');
    if(raw){
      try { return normalizeData(JSON.parse(raw)); }
      catch(e){ /* 损坏则回退 seed */ }
    }
    const seed = normalizeData(JSON.parse(JSON.stringify(SEED)));
    storeSave(seed); // 首次安装 seed
    return seed;
  }

  function storeSave(data){
    const json = JSON.stringify(data);
    try {
      const prev = localStorage.getItem(STORE_KEY);
      if(prev){
        const b1 = localStorage.getItem(STORE_KEY+'__bak');
        localStorage.setItem(STORE_KEY+'__bak2', b1 || prev);
        localStorage.setItem(STORE_KEY+'__bak', prev);
      }
      localStorage.setItem(STORE_KEY, json);
      return {ok:true};
    }catch(e){
      const quota = e && (e.name === 'QuotaExceededError' || e.code === 22 || e.code === 1014);
      return {ok:false, quota:quota, err:e};
    }
  }

  function exportJSON(data){
    const out = JSON.parse(JSON.stringify(data));
    out.schemaVersion = 1;
    out.exportedAt = new Date().toISOString();
    return JSON.stringify(out, null, 2);
  }

  function importJSON(text){
    let d;
    try { d = JSON.parse(text); } catch(e){ throw new Error('JSON 解析失败：不是有效的备份文件'); }
    if(!d || typeof d !== 'object' || (!d.dishes && !d.cuisines)){
      throw new Error('文件内容不像是菜谱备份（缺少 dishes / cuisines）');
    }
    if(d.schemaVersion && d.schemaVersion !== 1){
      throw new Error('schemaVersion 不受支持：' + d.schemaVersion);
    }
    return normalizeData(d);
  }

  function uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

  return {
    STORE_KEY:STORE_KEY, UNITS:UNITS, FUZZY_UNITS:FUZZY_UNITS, SECTIONS:SECTIONS,
    SECTION_LABEL:SECTION_LABEL, SECTION_ORDER:SECTION_ORDER, ALLERGENS:ALLERGENS,
    ORDER_STATUS:ORDER_STATUS, STATUS_LABEL:STATUS_LABEL,
    isFuzzy:isFuzzy, toBase:toBase, beautify:beautify, fmtNum:fmtNum,
    normalizeName:normalizeName, buildAliasMap:buildAliasMap, shouldScale:shouldScale,
    effServings:effServings, mergeIngredients:mergeIngredients, planSteps:planSteps,
    normalizeData:normalizeData, storeLoad:storeLoad, storeSave:storeSave,
    exportJSON:exportJSON, importJSON:importJSON, uid:uid
  };
})();

/* ============================================================

KM.ui = (function(){

  /* ---- 基础工具 ---- */
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function $(sel){ return document.querySelector(sel); }

  }
  function save(){
    const r = C.storeSave(data);
    if(!r.ok) toast(r.quota ? '存储空间已满，请到「设置」导出备份' : '保存失败', 'err');
    return r.ok;
  }
  function byId(id){ return data.dishes.find(function(d){ return d.id===id; }); }
  function cuisine(id){ return data.cuisines.find(function(c){ return c.id===id; }); }
  function category(id){ return data.categories.find(function(c){ return c.id===id; }); }
  function orderById(id){ return data.orders.find(function(o){ return o.id===id; }); }

  function activeOrder(){
    const last = data.settings.lastOrderId && orderById(data.settings.lastOrderId);
    if(last && last.status !== 'done') return last;
    const recent = data.orders.filter(function(o){ return o.status !== 'done'; })
      .sort(function(a,b){ return (b.createdAt||'').localeCompare(a.createdAt||''); })[0];
    return recent || null;
  }
  function getOrCreateOrder(){
    let o = activeOrder();
    if(!o){

        servings:data.settings.defaultServings||2, status:'draft', items:[], checked:[], pantryDeduct:true };
      data.orders.unshift(o);
    }
    return o;
  }
  function addDishToOrder(dishId){
    const dish = byId(dishId); if(!dish) return;
    // 忌口拦截（FR-04）

    if(hit.length){

        title:'忌口提醒',
        body:'<div class="alert">「'+esc(dish.name)+'」含忌口/过敏食材：'+esc(hit.join('、'))+'</div>仍然要加入吗？',

        onOk:function(){ _doAdd(dishId); }
      });
      return;
    }

  }
  function _doAdd(dishId){
    const o = getOrCreateOrder();
    const it = o.items.find(function(i){ return i.dishId===dishId; });
    if(it) it.qty = (it.qty||1)+1;
    else o.items.push({dishId:dishId, qty:1, servingsOverride:null, note:'', addedBy:'我'});

  /* ---- 弹窗 ---- */

  function renderOrder(view, id){

    (o.items||[]).forEach(function(it){

      const hit = (d.allergens||[]).filter(function(a){ return (data.settings.allergens||[]).indexOf(a)>=0; });
      if(hit.length) allergenWarn.push(d.name+'（'+hit.join('、')+'）');
    });

    const itemsHtml = (o.items||[]).length ? o.items.map(function(it, idx){

      const scaleBadge = (it.servingsOverride && it.servingsOverride>0) ? ' · 按 '+it.servingsOverride+' 人' : '';
      return '<div class="row-item">'+
        '<div class="grow">'+
          '<div class="name" style="cursor:pointer" onclick="KM.ui.nav(\'#/dish/'+esc(it.dishId)+'\')">'+esc(d.name)+' <span style="color:var(--muted);font-weight:400;font-size:12px">'+esc(cuisineName(d))+'</span></div>'+
          '<div class="sub">'+(it.note?esc(it.note)+' · ':'')+ (it.addedBy?'由 '+esc(it.addedBy)+' 选':'') + scaleBadge +'</div>'+
        '</div>'+
        '<span class="stepper"><button onclick="KM.ui.orderQty(\''+esc(o.id)+'\',\''+esc(it.dishId)+'\',-1)">−</button><span class="v">'+(it.qty||1)+'</span><button onclick="KM.ui.orderQty(\''+esc(o.id)+'\',\''+esc(it.dishId)+'\',1)">＋</button></span>'+
        '<button class="btn btn-sm btn-ghost" onclick="KM.ui.orderRemove(\''+esc(o.id)+'\','+idx+')">✕</button>'+
      '</div>';

        '<div class="field"><label>就餐人数</label><div><span class="stepper"><button onclick="KM.ui.orderServings(\''+esc(o.id)+'\',-1)">−</button><span class="v">'+(o.servings||2)+'</span><button onclick="KM.ui.orderServings(\''+esc(o.id)+'\',1)">＋</button></span></div></div>'+

  /* ---- 采购清单 ---- */
  function renderShopping(view, id){
    const o = orderById(id) || activeOrder();
    if(!o){ view.innerHTML = '<div class="empty"><div class="big">🛒</div><div>还没有备菜单</div><button class="btn btn-primary" onclick="KM.ui.nav(\'#/library\')">去选菜</button></div>'; return; }
    const items = C.mergeIngredients(data, o);
    const groups = {};
    items.forEach(function(it){ (groups[it.section] = groups[it.section]||[]).push(it); });
    const secOrder = ['meat','veg','staple','dry','seasoning','fuzzy'];
    const checkedSet = o.checked||[];
    const bought = items.filter(function(it){ return it.hasAtHome; });
    const needBuy = items.filter(function(it){ return !it.hasAtHome; });

    function row(it){
      const on = checkedSet.indexOf(it.key)>=0;
      const label = (it.fuzzy ? it.name+' '+it.unit : C.fmtNum(it.amount)+' '+it.unit);
      const srcs = (it.sources||[]).map(function(s){
        const d = data.dishes.find(function(x){ return x.name===s.split(' ×')[0]; });
        const did = d ? d.id : null;
        return did ? '<span class="link" onclick="KM.ui.nav(\'#/dish/'+esc(did)+'\')">'+esc(s)+'</span>' : esc(s);
      }).join('、');
      return '<div class="row-item">'+
        '<span class="check'+(on?' on':'')+'" onclick="KM.ui.toggleChecked(\''+esc(o.id)+'\',\''+esc(it.key)+'\')">'+(on?'✓':'')+'</span>'+
        '<div class="grow"><div class="name'+(on?' strike':'')+'">'+esc(it.name)+' <span style="font-weight:600;color:var(--accent)">'+esc(label)+'</span>'+(it.optional?' <span class="tag">可省</span>':'')+'</div>'+
        '<div class="sub">来自：'+srcs+'</div></div>'+
        '<button class="btn btn-sm" onclick="KM.ui.toggleAtHome(\''+esc(o.id)+'\',\''+esc(it.name)+'\', '+ (it.hasAtHome?'false':'true') +')">'+(it.hasAtHome?'恢复购买':'家里有')+'</button>'+
      '</div>';
    }

    let html = '<button class="btn btn-ghost btn-sm no-print" onclick="KM.ui.nav(\'#/order/'+esc(o.id)+'\')" style="margin-bottom:8px">← 返回</button>'+
      '<div class="page-title no-print">备菜单 · '+esc(o.title)+'</div>'+
      '<div class="print-only" style="text-align:center;padding:8px"><h2 style="margin:0">'+esc(o.title)+' · 备菜单</h2><div style="color:#666">'+o.servings+' 人 · '+new Date().toLocaleDateString('zh-CN')+'</div></div>';

    html += '<div class="card">';
    let any = false;
    secOrder.forEach(function(sec){
      const g = groups[sec]; if(!g || !g.length) return;
      any = true;
      const buy = g.filter(function(it){ return !it.hasAtHome; });
      if(!buy.length) return;
      html += '<div class="sec-head"><span>'+esc(C.SECTION_LABEL[sec]||sec)+'</span><span class="n">'+buy.length+'</span></div>';
      html += buy.map(row).join('');
    });
    if(!any) html += '<div class="empty">这份菜单没有需要采购的食材</div>';
    html += '</div>';

    if(bought.length){
      html += '<div class="card" style="margin-top:14px;opacity:.8">'+
        '<div class="sec-head" style="color:var(--muted)">✔ 无需购买（家里有）<span class="n" style="background:var(--muted)">'+bought.length+'</span></div>'+
        bought.map(row).join('')+'</div>';
    }

    html += '<div class="btn-row no-print">'+
      '<button class="btn" onclick="KM.ui.copyShopping(\''+esc(o.id)+'\')">复制文本</button>'+
      '<button class="btn" onclick="window.print()">打印</button>'+
      '<button class="btn btn-primary btn-lg" onclick="KM.ui.startCook(\''+esc(o.id)+'\')">备好了，开始做菜</button>'+
    '</div>';

    view.innerHTML = html;
  }

  /* ---- 厨房模式 ---- */
  function renderCook(view, id){
    const o = orderById(id) || activeOrder();
    if(!o){ view.innerHTML = '<div class="empty">没有可做的菜</div>'; return; }
    const plan = C.planSteps(data, o);
    const steps = plan.steps;
    const cd = o.cookDone || [];

    const rows = steps.map(function(s, idx){
      const done = cd.indexOf(idx)>=0;
      return '<div class="cook-step'+(done?' done':'')+'" id="cook_'+idx+'">'+
        '<div class="cook-no" onclick="KM.ui.cookToggle(\''+esc(o.id)+'\','+idx+')">'+(done?'✓':(idx+1))+'</div>'+
        '<div class="grow">'+
          '<div class="dish-tag">'+esc(s.dishName)+(s.qty>1?' ×'+s.qty:'')+'</div>'+
          '<div class="txt">'+esc(s.step.text)+'</div>'+
          '<div class="min">'+ (s.step.min?esc(s.step.min)+' 分钟':'') + (s.step.tool?' · 用'+esc(s.step.tool):'') + '</div>'+
          (s.step.tip?'<div class="sub">💡 '+esc(s.step.tip)+'</div>':'')+
          (s.hint?'<div class="hint">'+esc(s.hint)+'</div>':'')+
          (s.step.timerMin>0 ? '<div class="timer-box"><button class="btn btn-sm" onclick="KM.ui.startTimer('+s.step.timerMin+', \''+esc(s.step.text)+'\', '+idx+')">⏱ 开始计时 '+esc(s.step.timerMin)+' 分钟</button></div>' : '')+
        '</div></div>';
    }).join('');

    view.innerHTML =
      '<div class="no-print" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">'+
        '<button class="btn btn-ghost btn-sm" onclick="KM.ui.nav(\'#/shopping/'+esc(o.id)+'\')">← 备菜单</button>'+
        '<div style="color:var(--muted);font-size:12px">建议顺序 · 约 '+plan.total+' 分钟（已扣等待）</div>'+
      '</div>'+
      '<div class="page-title" style="margin-top:0">'+esc(o.title)+' · 做法</div>'+
      '<div class="timer-box" id="bigTimer" style="display:none;margin:0 0 12px">'+
        '<div class="timer-display" id="timerDisplay"></div>'+
        '<div class="timer-bar"><i id="timerBar"></i></div>'+
        '<div style="color:var(--muted);font-size:12px" id="timerLabel"></div>'+
      '</div>'+
      '<div class="card">'+rows+'</div>'+
      '<div class="btn-row sticky no-print">'+
        '<button class="btn btn-primary btn-lg" onclick="KM.ui.finishCook(\''+esc(o.id)+'\')">全部完成</button>'+
      '</div>';

    renderTimer();
  }

  function copyShopping(oid){
    const o = orderById(oid); if(!o) return;
    const items = C.mergeIngredients(data, o);
    const secOrder = ['meat','veg','staple','dry','seasoning','fuzzy'];
    const lines = [];
    secOrder.forEach(function(sec){
      const g = items.filter(function(it){ return it.section===sec; });
      if(!g.length) return;
      lines.push('【'+C.SECTION_LABEL[sec]+'】');
      g.forEach(function(it){
        const label = it.fuzzy ? it.name+' '+it.unit : C.fmtNum(it.amount)+' '+it.unit;
        lines.push((it.hasAtHome?'· ':'')+it.name+' '+label+(it.hasAtHome?'（家里有）':''));
      });
    });
    const text = o.title+' · 备菜单（'+o.servings+' 人）\n\n'+lines.join('\n');
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ toast('已复制'); }, function(){ fallbackCopy(text); });
    } else fallbackCopy(text);
  }
  function fallbackCopy(text){
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.left='-9999px';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('已复制'); } catch(e){ toast('复制失败'); }

  /* ---- 计时器 ---- */
  let timer = { id:null, remain:0, total:0, label:'', stepIdx:-1 };
  function startTimer(min, label, stepIdx){
    clearInterval(timer.id);
    timer.remain = Math.round(Number(min)*60);
    timer.total = timer.remain;
    timer.label = label || '';
    timer.stepIdx = stepIdx;
    requestWakeLock();
    $('#bigTimer').style.display = 'block';
    timer.id = setInterval(function(){
      timer.remain--;
      if(timer.remain <= 0){
        clearInterval(timer.id); timer.id = null;
        beep(); flash();
        toast('⏰ 计时结束：'+timer.label, 'err');
      }
      renderTimer();
    }, 1000);
    renderTimer();
  }
  function stopTimer(){ clearInterval(timer.id); timer.id=null; }
  function renderTimer(){
    const box = $('#bigTimer');
    if(!box) return;
    if(timer.id===null && timer.remain<=0 && !timer.total){ box.style.display='none'; return; }
    const mm = Math.floor(timer.remain/60), ss = timer.remain%60;
    const disp = (mm<10?'0':'')+mm+':'+(ss<10?'0':'')+ss;
    const el = $('#timerDisplay'), bar = $('#timerBar'), lab = $('#timerLabel');
    if(el) el.textContent = disp;
    if(bar) bar.style.width = (timer.total? Math.max(0, timer.remain/timer.total*100) : 0)+'%';
    if(lab) lab.textContent = timer.label || '';
  }
  function beep(){
    try {
      const ctx = new (window.AudioContext||window.webkitAudioContext)();
      [0, 0.2, 0.4].forEach(function(t){
        const o = ctx.createOscillator(); const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value = 880; o.type = 'sine';
        g.gain.setValueAtTime(0.0001, ctx.currentTime + t);
        g.gain.exponentialRampToValueAtTime(0.4, ctx.currentTime + t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + 0.18);
        o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.2);
      });
    } catch(e){}
  }
  function flash(){ document.body.style.transition='box-shadow .2s'; document.body.style.boxShadow='inset 0 0 0 2000px rgba(184,64,47,.18)'; setTimeout(function(){ document.body.style.boxShadow='none'; }, 600); }
  function requestWakeLock(){
    if(navigator.wakeLock){
      try { navigator.wakeLock.request('screen').catch(function(){}); } catch(e){}
    }
  }

  function saveDish(){
    const d = state.editDraft; if(!d) return;
    if(!d.name || !d.name.trim()){ toast('请填菜名', 'err'); return; }
    if(!(d.ingredients||[]).length){ toast('至少要有 1 个食材', 'err'); return; }
    if(!(d.steps||[]).length){ toast('至少要有 1 个步骤', 'err'); return; }
    if(d.id==='__new__'){
      const dup = data.dishes.some(function(x){ return x.name===d.name && !x.archived; });
      if(dup){ toast('已有同名菜「'+d.name+'」', 'err'); return; }
      d.id = C.uid('dish');
      d.createdAt = new Date().toISOString();
      d.updatedAt = new Date().toISOString();
      data.dishes.unshift(d);
    } else {
      const dup = data.dishes.some(function(x){ return x.id!==d.id && x.name===d.name && !x.archived; });
      if(dup){ toast('已有同名菜「'+d.name+'」', 'err'); return; }
      d.updatedAt = new Date().toISOString();
      const idx = data.dishes.findIndex(function(x){ return x.id===d.id; });
      if(idx >= 0) data.dishes[idx] = d;
    }
    // 步骤重排连续
    d.steps.forEach(function(s, i){ s.no = i+1; });
    save();
    state.editDraft = null;
    toast('已保存');
    nav('#/dish/'+d.id);
  }
  function duplicateDish(id){
    const d = byId(id); if(!d) return;
    const copy = JSON.parse(JSON.stringify(d));
    copy.id = C.uid('dish');
    copy.name = d.name + '（副本）';
    copy.createdAt = new Date().toISOString();
    copy.updatedAt = new Date().toISOString();
    data.dishes.unshift(copy);
    save(); toast('已复制'); nav('#/dish/'+copy.id);
  }
  function deleteDish(id){
    const d = byId(id); if(!d) return;
    const used = data.orders.some(function(o){ return (o.items||[]).some(function(i){ return i.dishId===id; }); }) ||
                 data.history.some(function(h){ return (h.dishIds||[]).indexOf(id)>=0; });
    if(used){
      confirmDialog({
        title:'删除「'+esc(d.name)+'」',
        body:'这道菜被历史记录引用。为保留历史可追溯，将改为「归档」——从菜谱库隐藏，但历史里仍能看到菜名。',
        okText:'归档', danger:true,
        onOk:function(){ d.archived=true; d.updatedAt=new Date().toISOString(); save(); toast('已归档'); nav('#/library'); }
      });
      return;
    }
    confirmDialog({
      title:'删除「'+esc(d.name)+'」', body:'删除后不可恢复，确定吗？', okText:'删除', danger:true,
      onOk:function(){ data.dishes = data.dishes.filter(function(x){ return x.id!==id; }); save(); toast('已删除'); nav('#/library'); }
    });
  }

    const refs = data.dishes.filter(function(d){ return (d.categoryIds||[]).indexOf(id)>=0; });
    if(refs.length){
      confirmDialog({ title:'该分类有 '+refs.length+' 道菜引用', body:'请先在菜品里改分类。', okText:'知道了' });
      return;
    }
    confirmDialog({ title:'删除分类', body:'确定删除？', okText:'删除', danger:true, onOk:function(){
      data.categories = data.categories.filter(function(c){ return c.id!==id; }); save(); renderManage(main());
    }});
  }
  function moveCuisine(i, dir){
    const arr = data.cuisines.slice().sort(function(a,b){return a.sort-b.sort;});
    const j = i+dir; if(j<0||j>=arr.length) return;
    const t = arr[i].sort; arr[i].sort = arr[j].sort; arr[j].sort = t;
    save(); renderManage(main());
  }
  function moveCategory(i, dir){
    const arr = data.categories.slice().sort(function(a,b){return a.sort-b.sort;});
    const j = i+dir; if(j<0||j>=arr.length) return;
    const t = arr[i].sort; arr[i].sort = arr[j].sort; arr[j].sort = t;
    save(); renderManage(main());
  }

  /* ---- 数据备份 ---- */
  function doExport(){
    const json = C.exportJSON(data);
    const blob = new Blob([json], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const d = new Date();
    const pad = function(n){ return (n<10?'0':'')+n; };
    a.href = url;
    a.download = 'kitchen-menu-'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'.json';
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    toast('已导出');
  }
  function doImport(input){
    const file = input.files && input.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(){
      let newData;
      try { newData = C.importJSON(reader.result); }
      catch(e){ toast(e.message, 'err'); input.value=''; return; }
      const n = newData.dishes.length;
      confirmDialog({
        title:'导入备份',
        body:'将覆盖当前数据（导入 '+n+' 道菜、'+newData.orders.length+' 份菜单）。当前数据会先自动存为备份。',
        okText:'覆盖导入', danger:true,
        onOk:function(){
          data = newData;
          save(); applyTheme(); input.value=''; toast('导入成功'); nav('#/home');
        }
      });
    };
    reader.readAsText(file);
  }
  function doReset(){
    confirmDialog({
      title:'恢复出厂示例', body:'将清空全部数据并恢复内置 10 道示例菜。确定？', okText:'恢复', danger:true,
      onOk:function(){
        data = C.normalizeData(JSON.parse(JSON.stringify(SEED)));
        save(); applyTheme(); toast('已恢复示例数据'); nav('#/home');
      }
    });
  }

  function addPantry(){
    const el = $('#pantryName');
    const name = (el.value||'').trim();
    if(!name) return;
    if(data.pantry.some(function(p){ return p.name===name; })){ toast('已有'); return; }
    data.pantry.push({name:name, amount:1, unit:'', checkedAt:new Date().toISOString()});
    save(); renderSettings(main());
  }
  function delPantry(i){ data.pantry.splice(i,1); save(); renderSettings(main()); }

  /* ---- 初始化 ---- */
  function init(){
    data = C.storeLoad();
    applyTheme();
    window.addEventListener('hashchange', function(){ route(); });
    renderSidebar();
    renderTabbar();
    route();
  }

  return {
    init:init, nav:nav, route:route,
    setFilter:setFilter, setSetting:setSetting, toggleTheme:toggleTheme, setAllergen:setAllergen,
    randomPick:randomPick, dishServings:dishServings, addToPantry:addToPantry,
    addDishToOrder:addDishToOrder,
    orderQty:orderQty, orderRemove:orderRemove, orderRename:orderRename, orderServings:orderServings,
    confirmOrder:confirmOrder, startCook:startCook,
    toggleChecked:toggleChecked, toggleAtHome:toggleAtHome, copyShopping:copyShopping,
    cookToggle:cookToggle, finishCook:finishCook, redoOrder:redoOrder,
    startTimer:startTimer,
    editField:editField, editTags:editTags, editTools:editTools, editCat:editCat, editAllergen:editAllergen,
    addIng:addIng, editIng:editIng, delIng:delIng, moveIng:moveIng,
    addStep:addStep, editStep:editStep, delStep:delStep, moveStep:moveStep,
    saveDish:saveDish, duplicateDish:duplicateDish, deleteDish:deleteDish,
    addCuisine:addCuisine, addCategory:addCategory, deleteCuisine:deleteCuisine, deleteCategory:deleteCategory,
    moveCuisine:moveCuisine, moveCategory:moveCategory,
    doExport:doExport, doImport:doImport, doReset:doReset,
    addPantry:addPantry, delPantry:delPantry,
    modalClose:modalClose
  };
})();

document.addEventListener('DOMContentLoaded', function(){ KM.ui.init(); });
if(document.readyState !== 'loading') KM.ui.init();
</script>
</body>
</html>
